name: Codespell
on: pull_request

jobs:
  codespell:
    name: Codespell
    runs-on: ${{ vars.RUNNER_LINUX_X64_4 || 'ubuntu-latest' }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
      - name: Codespell
        uses: codespell-project/actions-codespell@master
        with:
          ignore_words_list: iam,aks
          check_filenames: true
          check_hidden: true

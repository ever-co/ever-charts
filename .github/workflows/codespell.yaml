name: Codespell
on: pull_request

jobs:
  codespell:
    name: Codespell
    runs-on: ever-k8s-linux-x64-4
    steps:
      - name: Checkout Code
        uses: actions/checkout@v2
      - name: Codespell
        uses: codespell-project/actions-codespell@master
        with:
          ignore_words_list: iam,aks
          check_filenames: true
          check_hidden: true

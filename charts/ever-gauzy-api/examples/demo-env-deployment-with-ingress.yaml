global:
  env:
    production: false
  baseUrls:
    api: "demo-api.gauzy.co"
    
loglevel: "info"
adminPasswordReset: true
sentry:
  # Your own Sentry DSN, or empty to disable Sentry (never Ever's: forks would report into it).
  sentryDsn: ""
ingress:
  enabled: true
  className: "nginx"
  annotations:
    kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: demo-api.gauzy.co
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: chart-example-tls
      hosts:
        - demo-api.gauzy.co
envs:
  - name: EXPRESS_SESSION_SECRET
    value: "gauzy"
